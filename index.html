<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học & Kiểm tra</title>
<script>
  // đặt theme trước khi vẽ trang để không bị nháy màu
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
/* Sáng = trang vở ô li (mực tím, lề đỏ). Tối = nền đen. */
:root {
  --bg: #f4f5fb; --grid: rgba(92, 100, 196, .10); --grid-strong: rgba(92, 100, 196, .18);
  --paper: #ffffff; --ink: #24275e; --muted: #676b8f; --line: #dcdef0;
  --accent: #3b42c4; --accent-ink: #ffffff; --red: #d2323f; --ok: #1f7a4d;
  --margin: rgba(210, 50, 63, .55); --shadow: 0 1px 0 #e3e5f3, 0 12px 28px -18px rgba(36, 39, 94, .35);
  --side-bg: #262a6b; --side-ink: #ffffff; --side-muted: #b8bbe8; --side-active: #ffffff; --side-active-ink: #24275e;
  --hand: "Patrick Hand", "Comic Sans MS", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --grid: rgba(255, 255, 255, .035); --grid-strong: rgba(255, 255, 255, .065);
    --paper: #141414; --ink: #ededed; --muted: #a3a3a3; --line: #303030;
    --accent: #a9bdff; --accent-ink: #000000; --red: #ff8f8f; --ok: #8fe0b0;
    --margin: rgba(255, 143, 143, .35); --shadow: 0 0 0 1px #262626;
    --side-bg: #141414; --side-ink: #ededed; --side-muted: #a3a3a3; --side-active: #ededed; --side-active-ink: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --grid: rgba(255, 255, 255, .035); --grid-strong: rgba(255, 255, 255, .065);
  --paper: #141414; --ink: #ededed; --muted: #a3a3a3; --line: #303030;
  --accent: #a9bdff; --accent-ink: #000000; --red: #ff8f8f; --ok: #8fe0b0;
  --margin: rgba(255, 143, 143, .35); --shadow: 0 0 0 1px #262626;
  --side-bg: #141414; --side-ink: #ededed; --side-muted: #a3a3a3; --side-active: #ededed; --side-active-ink: #000000;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  font: 400 16px/1.6 "Be Vietnam Pro", system-ui, "Segoe UI", sans-serif;
  background-color: var(--bg);
  /* lưới ô li: ô nhỏ 8px, ô lớn 32px */
  background-image:
    linear-gradient(var(--grid-strong) 1px, transparent 1px), linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px, 32px 32px, 8px 8px, 8px 8px;
}
main { max-width: 780px; margin: 0 auto; padding: 20px 16px 64px; }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h2 { font-size: 25px; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 18px; font-weight: 700; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Menu trái: bìa vở, mép phải có hàng lỗ gáy lò xo ---------- */
.shell { display: grid; grid-template-columns: 304px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column;
  background: var(--side-bg); color: var(--side-ink); padding: 26px 34px 20px 18px;
}
.side::after { /* lỗ gáy */
  content: ""; position: absolute; top: 0; bottom: 0; right: 8px; width: 14px;
  background: radial-gradient(circle at 7px 14px, var(--bg) 4px, transparent 4.6px) 0 0 / 14px 28px repeat-y;
}
.side:empty { display: none; }
.shell:has(.side:empty) { display: block; }
.brand { color: var(--side-ink); text-decoration: none; padding: 0 10px; }
.brand b { display: block; font-size: 19px; line-height: 1.2; }
.brand span { font-family: var(--hand); font-size: 22px; color: #ff9aa4; }
.menu { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 4px; }
.menu a {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: 6px;
  color: var(--side-ink); text-decoration: none; font-weight: 500; line-height: 1.35;
}
.menu a:hover { background: color-mix(in srgb, var(--side-ink) 10%, transparent); }
.menu a[aria-current="page"] { background: var(--side-active); color: var(--side-active-ink); }
.menu .count { font-size: 14px; font-weight: 400; color: var(--side-muted); font-variant-numeric: tabular-nums; }
.menu a[aria-current="page"] .count { color: inherit; opacity: .7; }
.side :focus-visible { outline-color: var(--side-ink); }
.side-foot { margin-top: auto; padding: 18px 10px 0; font-size: 14px; color: var(--side-muted); display: grid; gap: 2px; justify-items: start; }
.side-foot .link { color: var(--side-ink); padding: 4px 0; }
main { min-width: 0; width: 100%; padding-top: 32px; }
.menu .short { display: none; }
@media (max-width: 860px) {
  .shell { display: block; }
  .side { position: static; height: auto; padding: 14px 16px 12px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px 12px; }
  .side::after { display: none; }
  .brand b { font-size: 17px; } .brand span { font-size: 18px; }
  .menu { grid-column: 1 / -1; grid-auto-flow: column; grid-auto-columns: max-content; margin: 0; overflow-x: auto; }
  .menu a { padding: 8px 12px; }
  .menu .full { display: none; } .menu .short { display: inline; }
  .side-foot { margin: 0; padding: 0; grid-row: 1; grid-column: 2; display: flex; gap: 10px; align-items: center; }
}
.page-title { margin-bottom: 4px; }

/* ---------- Trang giấy ---------- */
.sheet {
  position: relative; background: var(--paper); border-radius: 6px; box-shadow: var(--shadow);
  padding: 28px 28px 28px 56px; margin-bottom: 28px;
}
.sheet::before { /* đường lề đỏ của vở */
  content: ""; position: absolute; top: 0; bottom: 0; left: 36px; width: 0; border-left: 1.5px solid var(--margin);
}
.sheet > h2 { margin-bottom: 4px; }
.lede { color: var(--muted); margin: 0 0 20px; }

/* ---------- Form ---------- */
label, .label { display: block; font-size: 14px; font-weight: 500; margin: 18px 0 6px; }
.hint { font-weight: 400; color: var(--muted); }
input, select, textarea {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
  background: transparent; border: 1px solid var(--line); border-radius: 6px;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
textarea { min-height: 84px; resize: vertical; }
select option { background: var(--paper); color: var(--ink); }
/* ô chọn file: thêm dần nhiều lần, kéo thả được, xoá từng file */
.drop { border: 1.5px dashed var(--line); border-radius: 6px; padding: 12px; }
.drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.drop-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--muted); font-size: 14px; }
.drop-bar button { padding: 6px 12px; background: var(--bg); }
.drop input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.files { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
.files:empty { display: none; }
.files li { display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 10px; border-radius: 6px; background: var(--bg); font-size: 15px; }
.files .fname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.files .fsize { color: var(--muted); font-size: 13px; white-space: nowrap; }
.files button { padding: 2px 8px; border: 0; background: none; color: var(--red); font-size: 18px; line-height: 1; }
/* danh sách lecture tìm thấy khi cắt PDF */
.parts { display: grid; gap: 4px; max-height: 420px; overflow-y: auto; padding: 2px; }
.part { display: flex; align-items: baseline; gap: 10px; margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--bg); font-size: 15px; font-weight: 400; cursor: pointer; }
.part input { width: auto; flex: none; transform: translateY(2px); accent-color: var(--accent); }
.part .ptitle { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.part .prange { color: var(--muted); font-size: 13px; white-space: nowrap; }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr 1fr; } .sheet { padding: 22px 18px 22px 40px; } .sheet::before { left: 24px; } }

/* chọn kiểu soạn: 3 nút dính nhau */
.modes { display: flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.modes label { flex: 1 1 140px; margin: 0; position: relative; }
.modes input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.modes span { display: block; text-align: center; padding: 9px 10px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--muted); }
.modes input:checked + span { background: var(--accent); color: var(--accent-ink); }
.modes input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Nút ---------- */
button, .btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; font: inherit; font-weight: 500;
  border-radius: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  cursor: pointer; text-decoration: none; line-height: 1.2;
}
button:hover, .btn:hover { border-color: var(--accent); }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.primary:hover { filter: brightness(1.08); }
.link { border: 0; background: none; padding: 6px 4px; color: var(--accent); }
.link:hover { text-decoration: underline; }
.link.danger { color: var(--red); }
button:disabled { opacity: .65; cursor: progress; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 22px; }
.err { color: var(--red); margin-top: 12px; }
.err:empty { display: none; }
.wait { color: var(--muted); margin-top: 12px; }
.hidden { display: none !important; }

/* ---------- Danh sách ---------- */
.list-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 6px; }
.list-head .muted { color: var(--muted); font-size: 14px; }
.rows { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); margin-bottom: 28px; }
.rowi { padding: 16px 20px; border-top: 1px dashed var(--line); }
.rowi:first-child { border-top: 0; }
.rowi h3 { font-size: 17px; }
.meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.rowi .actions { margin-top: 8px; gap: 2px 12px; }
.empty { padding: 22px 20px; color: var(--muted); }
.hist { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: inherit; }
.hist:hover h3 { color: var(--accent); }
.mark { font-family: var(--hand); color: var(--red); font-size: 30px; line-height: 1; white-space: nowrap; }

/* ---------- Bài giảng ---------- */
.lesson { max-width: 68ch; line-height: 1.7; }
.lesson h1 { font-size: 31px; margin: 0 0 12px; }
.lesson h2 { font-size: 22px; margin: 32px 0 8px; }
.lesson h3 { margin: 24px 0 6px; }
.lesson blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
.lesson code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.lesson pre { background: var(--bg); padding: 12px; border-radius: 6px; overflow-x: auto; }
.lesson table { border-collapse: collapse; display: block; overflow-x: auto; }
.lesson th, .lesson td { border: 1px solid var(--line); padding: 6px 10px; }
.lesson img { max-width: 100%; }

/* ---------- Làm bài ---------- */
.timer {
  position: sticky; top: 10px; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: var(--paper); box-shadow: var(--shadow); border-radius: 6px; padding: 10px 18px; margin-bottom: 14px;
}
.timer b { font-variant-numeric: tabular-nums; font-size: 20px; }
.timer.low b { color: var(--red); }
.paper-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 20px; color: var(--muted); font-size: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.q { padding: 22px 0; border-bottom: 1px dashed var(--line); position: relative; }
.q:last-of-type { border-bottom: 0; }
.qn { font-weight: 700; }
.opts { display: grid; gap: 4px; margin-top: 10px; }
.opt { display: flex; align-items: flex-start; gap: 12px; margin: 0; padding: 6px 8px; border-radius: 6px; font-size: 16px; font-weight: 400; cursor: pointer; }
.opt:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.bubble { /* ô tô kiểu phiếu trắc nghiệm */
  flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted);
  display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted);
}
.opt input:checked + .bubble { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.opt input:focus-visible + .bubble { outline: 2px solid var(--accent); outline-offset: 2px; }
.q textarea { margin-top: 10px; min-height: 140px; }
.qtext { display: inline; } .qtext > :first-child { display: inline; } .qtext p { margin: 6px 0; }
.qtext table { margin: 8px 0; }
.numans { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; font-size: 16px; font-weight: 400; }
.numans input { width: 180px; }

/* ---------- Kết quả ---------- */
.result-top { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.score {
  font-family: var(--hand); color: var(--red); font-size: 64px; line-height: 1;
  border: 3px solid var(--red); border-radius: 50% 46% 52% 48%; padding: 18px 22px 12px; transform: rotate(-6deg);
  animation: stamp .45s cubic-bezier(.2, 1.4, .4, 1) both;
}
@keyframes stamp { from { opacity: 0; transform: rotate(-14deg) scale(1.5); } }
@media (prefers-reduced-motion: reduce) { .score { animation: none; } }
.tick { position: absolute; left: -40px; top: 18px; font-family: var(--hand); font-size: 28px; line-height: 1; }
@media (max-width: 560px) { .tick { left: -32px; font-size: 24px; } }
.tick.ok { color: var(--ok); } .tick.bad { color: var(--red); }
.opt.static { cursor: default; } .opt.static:hover { background: none; }
.opt.right .bubble { border-color: var(--ok); color: var(--ok); }
.opt.picked .bubble { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.opt.picked.wrong .bubble { background: var(--red); border-color: var(--red); }
.note { margin-top: 10px; padding: 10px 14px; border-radius: 6px; background: var(--bg); font-size: 15px; }
.note b { color: var(--red); font-family: var(--hand); font-weight: 400; font-size: 20px; }
.answer { white-space: pre-wrap; margin-top: 8px; }

/* ---------- Đăng nhập ---------- */
.auth { max-width: 400px; margin: 8vh auto 0; }
.auth .lede { margin-bottom: 4px; }

@media print {
  body { background: #fff; color: #000; } .side, .actions, .timer { display: none !important; } .shell { display: block; }
  .sheet { box-shadow: none; padding: 0; } .sheet::before { display: none; }
}
</style>
</head>
<body>
<div class="shell"><nav class="side" id="side" aria-label="Menu chính"></nav><main id="app"></main></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ABC = "ABCDEFGH";
const app = $("#app");
let me = null, timerId = null;

// ---------- Sáng / tối ----------
const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
function toggleTheme() {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
  document.querySelectorAll(".theme-btn").forEach(paintThemeBtn);
}
function paintThemeBtn(b) {
  b.textContent = isDark() ? "☀ Sáng" : "☾ Tối";
  b.setAttribute("aria-label", isDark() ? "Chuyển sang chế độ sáng" : "Chuyển sang chế độ tối");
}
const themeBtn = () => `<button class="link theme-btn" onclick="toggleTheme()"></button>`;
const afterRender = () => {
  document.querySelectorAll(".theme-btn").forEach(paintThemeBtn);
  // công thức $...$ trong bài giảng, câu hỏi, bản ghi nhớ -> hiển thị toán học
  window.renderMathInElement?.(app, { throwOnError: false,
    delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }] });
};
// Markdown có công thức: tạm giấu $...$ để marked không biến dấu _ trong công thức thành chữ nghiêng
function md(text) {
  const math = [];
  const safe = text.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => `@@M${math.push(m) - 1}@@`);
  return DOMPurify.sanitize(marked.parse(safe)).replace(/@@M(\d+)@@/g, (_, i) => esc(math[i]));
}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json" }, body: opts.body && JSON.stringify(opts.body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/api/login") { me = null; renderAuth(); throw new Error(data.error); }
  if (!r.ok) throw new Error(data.error || "Máy chủ gặp lỗi. Kiểm tra cửa sổ đen đang chạy chay.bat.");
  return data;
}

// ---------- Ô chọn nhiều file: mỗi lần chọn được cộng thêm vào danh sách ----------
const MAX_MB = 70;  // khớp MAX_UPLOAD của server (base64 làm to thêm ~1/3)
const picked = { docs: [], samples: [] };
const fmtSize = b => b < 1048576 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${(b / 1048576).toFixed(1)} MB`;
const dropBox = (key, label) => `<div class="drop" id="${key}Drop">
  <input id="${key}" type="file" multiple accept=".pdf,.docx,.txt,.md" tabindex="-1" aria-hidden="true">
  <div class="drop-bar"><button type="button" onclick="$('#${key}').click()">Thêm file</button>
    <span>hoặc kéo thả ${label} vào đây</span></div>
  <ul class="files" id="${key}List" aria-label="${label} đã chọn"></ul></div>`;

function addFiles(key, files) {
  const ok = /\.(pdf|docx|txt|md)$/i;
  for (const f of files) {
    if (!ok.test(f.name)) { $("#err").textContent = `Bỏ qua ${f.name}: chỉ nhận PDF, DOCX, TXT, MD.`; continue; }
    if (!picked[key].some(x => x.name === f.name && x.size === f.size)) picked[key].push(f);
  }
  showFiles(key);
}
function showFiles(key) {
  $(`#${key}List`).innerHTML = picked[key].map((f, i) => `<li><span class="fname">${esc(f.name)}</span>
    <span class="fsize">${fmtSize(f.size)}</span>
    <button type="button" onclick="picked.${key}.splice(${i},1);showFiles('${key}')" aria-label="Bỏ file ${esc(f.name)}">✕</button></li>`).join("");
}
function wireDrop(box, input, onFiles) {
  input.onchange = () => { onFiles(input.files); input.value = ""; };
  box.ondragover = e => { e.preventDefault(); box.classList.add("over"); };
  box.ondragleave = () => box.classList.remove("over");
  box.ondrop = e => { e.preventDefault(); box.classList.remove("over"); onFiles(e.dataTransfer.files); };
}
function wirePicker(key) {
  wireDrop($(`#${key}Drop`), $(`#${key}`), files => addFiles(key, files));
  showFiles(key);
}

const readFiles = files => Promise.all([...files].map(f => new Promise((ok, fail) => {
  const fr = new FileReader();
  fr.onload = () => ok({ name: f.name, data: fr.result.split(",")[1] });
  fr.onerror = fail;
  fr.readAsDataURL(f);
})));

// ---------- Menu trái ----------
// [mục, đường dẫn, nhãn đầy đủ, nhãn ngắn cho điện thoại]
const MENU = [["create", "#/", "Tạo bài giảng / đề kiểm tra", "Tạo mới"], ["subjects", "#/subjects", "Môn học", "Môn học"],

function wireModes(form) {
  const mode = () => form.querySelector("[name=mode]:checked").value;
  form.querySelectorAll("[name=mode]").forEach(r => r.onchange = () => {
    form.querySelectorAll(".exam-only").forEach(x => x.classList.toggle("hidden", mode() === "lesson"));

// chạy việc gọi Claude: khoá nút, đếm giây, báo lỗi; xong thì mở bài vừa tạo
async function runGen(text, call) {
  const btn = $("#genBtn"), wait = $("#wait"), started = Date.now();
  btn.disabled = true; wait.classList.remove("hidden"); $("#err").textContent = "";
  const tick = () => wait.textContent = `${text} (${Math.round((Date.now() - started) / 1000)} giây). Đừng đóng trang.`;
  tick(); const iv = setInterval(tick, 1000);
  try { location.hash = `#/lesson/${(await call()).id}`; }
  catch (x) { $("#err").textContent = x.message; btn.disabled = false; wait.classList.add("hidden"); }
  finally { clearInterval(iv); }
}

async function addPending(files) {
  const kind = document.querySelector("[name=kind]:checked").value, err = $("#scanErr"), wait = $("#scanWait");
  err.textContent = "";
  for (const file of files) {
    if (!/\.(pdf|docx|txt|md)$/i.test(file.name)) { err.textContent = `Bỏ qua ${file.name}: chỉ nhận PDF, DOCX, TXT, MD.`; continue; }
    const item = { file, kind, pages: null, parts: [] };
    if (/\.pdf$/i.test(file.name)) {
      wait.classList.remove("hidden"); wait.textContent = `Đang đọc ${file.name}…`;
      try {
        await ensurePdfLibs();
        item.bytes = new Uint8Array(await file.arrayBuffer());
        const doc = await pdfjsLib.getDocument({ data: item.bytes.slice() }).promise;
        item.pages = doc.numPages;
        // tài liệu học dài: tách theo lecture để chỉ quét phần cần; đề mẫu giữ nguyên
        if (kind === "doc") {
          let parts = await outlineParts(doc).catch(() => []);
          if (parts.length < 2) parts = await textParts(doc, (i, n) => wait.textContent = `Đang tìm lecture trong ${file.name}: trang ${i}/${n}…`);
          if (parts.length >= 2) item.parts = parts.map(p => ({ ...p, on: false }));
        }
        doc.destroy();
      } catch (x) { err.textContent = `Không đọc được ${file.name}: ${x.message}`; continue; }
      finally { wait.classList.add("hidden"); }
    }
    pend.push(item);
  }
  showPending();
}

function showPending() {
  const box = $("#pendList");
  if (!box) return;
  box.innerHTML = pend.map((it, i) => `<div style="margin-top:10px">
    <div class="files"><li><span class="fname">${it.kind === "sample" ? "Đề mẫu: " : ""}${esc(it.file.name)}</span>
      <span class="fsize">${it.pages ? it.pages + " trang, " : ""}${fmtSize(it.file.size)}</span>
      <button type="button" onclick="pend.splice(${i},1);showPending()" aria-label="Bỏ ${esc(it.file.name)}">✕</button></li></div>
    ${it.parts.length ? `<p class="meta" style="margin:6px 0">Tìm thấy ${it.parts.length} lecture. Chọn lecture cần quét (mỗi lecture lưu thành một tài liệu); không chọn gì thì quét cả file.</p>
      <div class="parts">${it.parts.map((p, j) => `<label class="part"><input type="checkbox" ${p.on ? "checked" : ""}
        onchange="pend[${i}].parts[${j}].on=this.checked;sumPending()"><span class="ptitle">${esc(p.title)}</span>
        <span class="prange">trang ${p.from}–${p.to}</span></label>`).join("")}</div>` : ""}</div>`).join("");
  sumPending();
}
// mỗi việc quét: một lecture đã chọn, hoặc cả file nếu không chọn lecture nào
const pendingJobs = () => pend.flatMap(it => {
  const on = it.parts.filter(p => p.on);
  return on.length ? on.map(p => ({ it, part: p })) : [{ it, part: null }];
});
function sumPending() {
  const n = pend.length ? pendingJobs().length : 0;
  $("#scanBtn").textContent = n ? `Quét và lưu (${n} mục)` : "Quét và lưu";
  $("#scanBtn").disabled = !n;
}

async function scanPending(id) {
  const jobs = pendingJobs(), wait = $("#scanWait"), err = $("#scanErr"), fails = [];
  $("#scanBtn").disabled = true; wait.classList.remove("hidden"); err.textContent = "";
  let done = 0;
  const one = async ({ it, part }) => {
    const name = part ? part.title : it.file.name;
    try {
      const file = part ? new File([await cutPdf(it.bytes, Array.from({ length: part.to - part.from + 1 }, (_, k) => part.from + k))],
        name.replace(/[\\/:*?"<>|]/g, " ") + ".pdf") : it.file;
      const [f] = await readFiles([file]);
      await api(`/api/subjects/${id}/docs`, { method: "POST",
        body: { kind: it.kind, name, file: file.name, data: f.data, pages: part ? part.to - part.from + 1 : it.pages } });
    } catch (x) { fails.push(`${name}: ${x.message}`); }
    wait.textContent = `Đã quét ${++done}/${jobs.length}. Mỗi mục mất khoảng 1–2 phút, đừng đóng trang.`;
  };
  wait.textContent = `Đang quét 0/${jobs.length}. Mỗi mục mất khoảng 1–2 phút, đừng đóng trang.`;
  // quét 2 mục cùng lúc cho nhanh mà không dồn quá nhiều lượt Claude một lúc
  const queue = [...jobs];
  await Promise.all([0, 1].map(async () => { while (queue.length) await one(queue.shift()); }));
  pend = [];
  if (location.hash !== `#/subject/${id}`) return;
  await route();
  if (fails.length) $("#scanErr").textContent = "Không quét được: " + fails.join("; ");
}

}

async function renderExam(id) {

    <form class="sheet" id="exam">

      ${e.questions.map((q, i) => `<fieldset class="q" style="border:0;margin:0;padding-left:0;padding-right:0">
        <legend style="display:contents"><span class="qn">Câu ${i + 1}.</span></legend>${qText(q)}
        ${q.type === "mcq" ? `<div class="opts">${q.options.map((o, j) => `<label class="opt">
            <input type="radio" name="q${i}" value="${j}"><span class="bubble">${ABC[j]}</span><span>${esc(o)}</span></label>`).join("")}</div>`
          : q.type === "numeric" ? `<label class="numans">Answer: <input name="q${i}" inputmode="decimal" autocomplete="off" aria-label="Đáp số câu ${i + 1}"></label>`

      <div class="actions"><button class="primary" id="submitBtn">Nộp bài</button></div>
      <div class="wait hidden" id="wait" role="status">Đang chấm bài…</div><div class="err" id="err" role="alert"></div>
    </form>`;
  afterRender();

  const form = $("#exam");
  const end = Date.now() + e.duration_min * 60000;
  let sent = false;
  const submit = async () => {
    if (sent) return; sent = true;
    clearInterval(timerId); window.onbeforeunload = null;
    $("#submitBtn").disabled = true; $("#wait").classList.remove("hidden"); $("#err").textContent = "";
    const answers = e.questions.map((q, i) => {
      if (q.type !== "mcq") return form.elements[`q${i}`].value;
      const c = form.querySelector(`[name=q${i}]:checked`);
      return c ? +c.value : null;
    });
    try {
      const r = await api(`/api/exams/${id}/submit`, { method: "POST", body: { answers } });
      location.hash = `#/result/${r.id}`;
    } catch (x) { $("#err").textContent = x.message + " Bấm Nộp bài để thử lại."; sent = false; $("#submitBtn").disabled = false; $("#wait").classList.add("hidden"); }
  };
  const tick = () => {
    const left = Math.max(0, end - Date.now());
    $("#clock").textContent = `${String(Math.floor(left / 60000)).padStart(2, "0")}:${String(Math.floor(left / 1000) % 60).padStart(2, "0")}`;
    $("#timer").classList.toggle("low", left < 60000);
    if (!left) { alert("Hết giờ. Bài làm sẽ được nộp ngay."); submit(); }
  };
  tick(); timerId = setInterval(tick, 1000);
  window.onbeforeunload = () => "Bài làm chưa nộp sẽ mất.";
  form.onsubmit = ev => { ev.preventDefault(); if (confirm("Nộp bài bây giờ?")) submit(); };
}

// ---------- Cắt PDF (chạy hoàn toàn trong trình duyệt, không gửi file lên server, không tốn lượt Claude) ----------
const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
const loadScript = src => new Promise((ok, fail) => {
  const s = document.createElement("script");
  s.src = src; s.onload = ok;
  s.onerror = () => fail(new Error("Không tải được thư viện đọc PDF. Kiểm tra kết nối mạng rồi thử lại."));
  document.head.append(s);
});
let pdfLibs = null;  // chỉ tải thư viện PDF khi mở trang cắt
const ensurePdfLibs = () => pdfLibs ||= Promise.all([loadScript(PDFJS + "pdf.min.js"),
    loadScript("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js")])
  .then(() => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; })
  .catch(e => { pdfLibs = null; throw e; });

// "1-12, 30-45, 50" -> [1..12, 30..45, 50]
function parseRanges(text, n) {
  const pages = new Set();
  for (const part of text.replace(/\s*[-–]\s*/g, "-").split(/[,;\s]+/).filter(Boolean)) {
    const m = part.match(/^(\d+)(?:-(\d+))?$/);
    if (!m) throw new Error(`Không hiểu "${part}". Viết số trang như: 1-12, 30-45, 50`);
    const a = +m[1], b = +(m[2] || m[1]);
    if (a < 1 || b > n || a > b) throw new Error(`Khoảng "${part}" không hợp lệ: file chỉ có ${n} trang.`);
    for (let p = a; p <= b; p++) pages.add(p);
  }
  return [...pages].sort((x, y) => x - y);
}
// [1,2,3,5,7,8] -> "1-3, 5, 7-8"
const rangesText = pages => pages.reduce((r, p) => {
  const last = r[r.length - 1];
  last && p === last[1] + 1 ? last[1] = p : r.push([p, p]);
  return r;
}, []).map(([a, b]) => a === b ? `${a}` : `${a}-${b}`).join(", ");

// Nhãn lecture của từng trang ({key, title} hoặc null) -> các phần liền nhau. Trang không nhãn thuộc phần trước nó,
// nên chạy được cả khi "Lecture 6" chỉ in ở trang đầu lẫn khi in ở chân mọi slide.
function partsFromLabels(labels) {
  const parts = []; let cur = null;
  labels.forEach((l, i) => {
    if (l && (!cur || cur.key !== l.key)) parts.push(cur = { key: l.key, title: l.title, from: i + 1, to: i + 1 });
    else if (cur) cur.to = i + 1;
  });
  return parts;
}

async function outlineParts(doc) {
  let items = await doc.getOutline();
  if (!items || !items.length) return [];
  while (items.length === 1 && items[0].items?.length) items = items[0].items;  // bỏ tầng chỉ có tên sách
  const starts = [];
  for (const it of items) {
    try {
      const d = typeof it.dest === "string" ? await doc.getDestination(it.dest) : it.dest;
      if (!d) continue;
      starts.push({ title: it.title.replace(/[\x00-\x1f]/g, "").trim(), from: (typeof d[0] === "object" ? await doc.getPageIndex(d[0]) : d[0]) + 1 });
    } catch {}  // bookmark hỏng: bỏ qua
  }
  starts.sort((a, b) => a.from - b.from);
  return starts.map((s, i) => ({ ...s, to: (starts[i + 1]?.from ?? doc.numPages + 1) - 1 })).filter(s => s.to >= s.from);
}

// dòng BẮT ĐẦU bằng "Lecture 6", "Lec01.", "Chương 3"... (tiêu đề hoặc footer), không bắt câu "xem Lecture 9" giữa bài
const LECTURE_RE = /^(lecture|lec|chapter|lesson|unit|week|chương|bài|tuần)\.?\s*([0-9]{1,3}|[IVXLC]{1,6})\b/i;
const KIND = { lec: "lecture" };
const labelsIn = lines => lines.map(s => [s, s.match(LECTURE_RE)]).filter(([, m]) => m).map(([s, m]) => {
  const kind = m[1].toLowerCase(), num = /\d/.test(m[2]) ? String(+m[2]) : m[2].toUpperCase();
  return { key: `${KIND[kind] || kind} ${num}`, title: s.length > 80 ? s.slice(0, 77) + "…" : s };  // "Lec01" = "Lecture 1"
});
// nhãn lấy từ 3 dòng đầu + 3 dòng cuối trang (tiêu đề, footer); trang nhắc từ 3 lecture trở lên là trang mục lục
function pageLabel(lines) {
  if (new Set(labelsIn(lines).map(l => l.key)).size >= 3) return null;
  return labelsIn([...lines.slice(0, 3), ...lines.slice(-3)])[0] || null;
}
async function textParts(doc, progress) {
  const labels = [];
  for (let i = 1; i <= doc.numPages; i++) {
    if (i % 10 === 0) progress(i, doc.numPages);
    labels.push(pageLabel((await (await doc.getPage(i)).getTextContent()).items.map(t => t.str.trim()).filter(Boolean)));
  }
  return partsFromLabels(labels);
}

async function cutPdf(bytes, pages) {
  const src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
  const out = await PDFLib.PDFDocument.create();
  (await out.copyPages(src, pages.map(p => p - 1))).forEach(p => out.addPage(p));
  return out.save();
}

let cut = null;  // file đang cắt: { name, size, bytes, pages, parts, how, checked, ranges }

function renderCut() {
  app.innerHTML = `<div class="sheet">
    <h2>Cắt file PDF</h2>
    <p class="lede">Chọn các lecture cần học trong giáo trình dài để có file nhỏ hơn. File được cắt ngay trên máy bạn, không tốn lượt Claude.</p>
    <div class="drop" id="cutDrop">
      <input id="cutFile" type="file" accept=".pdf,application/pdf" tabindex="-1" aria-hidden="true">
      <div class="drop-bar"><button type="button" onclick="$('#cutFile').click()">${cut ? "Chọn file khác" : "Chọn file PDF"}</button>
        <span>hoặc kéo thả file PDF vào đây</span></div>
    </div>
    <div class="wait hidden" id="cutWait" role="status"></div>
    <div class="err" id="err" role="alert"></div>
    <div id="cutBody"></div></div>`;
  wireDrop($("#cutDrop"), $("#cutFile"), files => files[0] && loadCut(files[0]));
  if (cut) showCut();
}

async function loadCut(file) {
  const wait = $("#cutWait");
  $("#err").textContent = ""; $("#cutBody").innerHTML = "";
  if (!/\.pdf$/i.test(file.name)) { $("#err").textContent = "Chỉ cắt được file PDF."; return; }
  wait.classList.remove("hidden"); wait.textContent = "Đang mở file…";
  try {
    await ensurePdfLibs();
    const bytes = new Uint8Array(await file.arrayBuffer());
    const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;  // pdf.js giữ bản sao, bytes để dành cho pdf-lib
    let parts = await outlineParts(doc).catch(() => []), how = "mục lục (bookmark) của file";
    if (parts.length < 2) {
      parts = await textParts(doc, (i, n) => wait.textContent = `Đang tìm tiêu đề lecture: trang ${i}/${n}…`);
      how = "tiêu đề Lecture, Chương, Bài… in trên trang";
    }
    cut = { name: file.name, size: file.size, bytes, pages: doc.numPages, parts, how, checked: new Set(), ranges: "" };
    doc.destroy();
    showCut();
  } catch (x) {
    cut = null;
    if ($("#err")) $("#err").textContent = /password/i.test(x.message) ? "File PDF có mật khẩu, không cắt được." : "Không đọc được file PDF này. " + x.message;
  } finally { wait.classList.add("hidden"); }
}

function showCut() {
  const body = $("#cutBody");
  if (!body) return;  // người dùng đã chuyển trang
  body.innerHTML = `<p class="meta" style="margin:14px 0 0">${esc(cut.name)}: ${cut.pages} trang, ${fmtSize(cut.size)}</p>
    <div class="label">Các phần tìm thấy <span class="hint">(theo ${cut.how})</span></div>
    ${cut.parts.length ? `<div class="parts">${cut.parts.map((p, i) => `<label class="part">
        <input type="checkbox" value="${i}" ${cut.checked.has(i) ? "checked" : ""}>
        <span class="ptitle">${esc(p.title)}</span><span class="prange">trang ${p.from}–${p.to} (${p.to - p.from + 1} trang)</span></label>`).join("")}</div>`
      : `<p class="meta">Không tìm thấy mục lục hay tiêu đề lecture trong file. Nhập số trang cần lấy ở ô dưới.</p>`}
    <label for="cutRanges">Thêm trang theo số <span class="hint">(không bắt buộc)</span></label>
    <input id="cutRanges" placeholder="VD: 1-12, 30-45, 50" value="${esc(cut.ranges)}" inputmode="numeric">
    <p class="meta" id="cutSum" role="status"></p>
    <div class="actions"><button class="primary" id="cutUse">Dùng để tạo bài giảng / đề</button><button id="cutSave">Tải file đã cắt</button></div>`;
  body.querySelectorAll(".part input").forEach(c => c.onchange = () => {
    c.checked ? cut.checked.add(+c.value) : cut.checked.delete(+c.value); sumCut();
  });
  $("#cutRanges").oninput = e => { cut.ranges = e.target.value; sumCut(); };
  $("#cutUse").onclick = () => doCut(true);
  $("#cutSave").onclick = () => doCut(false);
  sumCut();
}

function selectedPages() {
  const set = new Set(parseRanges(cut.ranges, cut.pages));
  for (const i of cut.checked) for (let p = cut.parts[i].from; p <= cut.parts[i].to; p++) set.add(p);
  return [...set].sort((a, b) => a - b);
}
function sumCut() {
  try {
    const p = selectedPages();
    $("#cutSum").textContent = p.length ? `Đã chọn ${p.length}/${cut.pages} trang: ${rangesText(p)}.` : "Chưa chọn trang nào.";
    $("#err").textContent = "";
  } catch (x) { $("#cutSum").textContent = ""; $("#err").textContent = x.message; }
}

async function doCut(use) {
  let pages;
  try { pages = selectedPages(); } catch (x) { $("#err").textContent = x.message; return; }
  if (!pages.length) { $("#err").textContent = "Chọn ít nhất một phần, hoặc nhập số trang cần lấy."; return; }
  const wait = $("#cutWait"), btns = [$("#cutUse"), $("#cutSave")];
  wait.classList.remove("hidden"); wait.textContent = "Đang cắt file…"; btns.forEach(b => b.disabled = true);
  try {
    const bytes = await cutPdf(cut.bytes, pages);
    const tag = rangesText(pages).replace(/, /g, "_");
    const name = `${cut.name.replace(/\.pdf$/i, "")}_trang_${tag.length > 40 ? pages.length : tag}.pdf`;
    const file = new File([bytes], name, { type: "application/pdf" });
    if (use) {
      if (!picked.docs.some(f => f.name === file.name && f.size === file.size)) picked.docs.push(file);
      location.hash = "#/";
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    wait.textContent = `Đã tạo ${name}: ${pages.length} trang, ${fmtSize(file.size)} (file gốc ${fmtSize(cut.size)}).`;
  } catch (x) { $("#err").textContent = "Không cắt được file: " + x.message; wait.classList.add("hidden"); }
  finally { btns.forEach(b => b.disabled = false); }
}

if (location.search.includes("selftest")) {  // tự kiểm tra: mở /?selftest rồi xem Console
  console.assert(rangesText([1, 2, 3, 5, 7, 8]) === "1-3, 5, 7-8", "rangesText");
  console.assert(JSON.stringify(parseRanges("3 - 5, 1 ;4", 10)) === "[1,3,4,5]", "parseRanges");
  console.assert((() => { try { parseRanges("5-20", 10); } catch { return true; } })(), "parseRanges vượt số trang");
  const L = (...lines) => pageLabel(lines);
  console.assert(JSON.stringify(partsFromLabels([null, L("Lec01. INTRO"), null, L("Lecture 1"), L("LECTURE 2. CI"), null])
    .map(p => [p.title, p.from, p.to])) === '[["Lec01. INTRO",2,4],["LECTURE 2. CI",5,6]]', "partsFromLabels");
  console.assert(L("Slide", "see Lecture 9", "x", "Lecture 2").key === "lecture 2", "pageLabel bỏ câu nhắc giữa bài");
  console.assert(L("Exercise - Lecture 04", "x") === null, "pageLabel bỏ trang bài tập cuối lecture");
  console.assert(L("Mục lục", "Chương 1", "Chương 2", "Chương 3") === null, "pageLabel trang mục lục");
  console.assert(L("CHƯƠNG iv. Ước lượng").key === "chương IV", "pageLabel số La Mã");
  console.log("selftest xong");
}

// ---------- Điều hướng ----------
async function route() {
  clearInterval(timerId); window.onbeforeunload = null;
  if (!me) { try { me = await api("/api/me"); } catch { return; } }
  const [, page, id] = location.hash.split("/");
  try {
    [items, subjects] = await Promise.all([api("/api/exams"), api("/api/subjects")]);
    renderNav(page);
    await ({ subjects: renderSubjects, subject: renderSubject, cut: renderCut, lessons: renderLessons, exams: renderExams, lesson: renderLesson, exam: renderExam, result: renderResult }[page] || renderCreate)(id);
  } catch (x) { if (me) app.innerHTML = `<div class="sheet err">${esc(x.message)} <a href="#/">Về trang tạo bài</a></div>`; }
  afterRender();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", afterRender);
route();
